[package]
name = "rapier2d_classes"
description = "The rapier2d step split across declared Starknet classes: contact generation and the island solve, library-called through StepConfig."
version.workspace = true
edition.workspace = true
cairo-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["physics", "rapier", "rigid-body", "2d", "starknet"]
documentation = "https://github.com/bal7hazar/rapier-cairo/tree/main/crates/rapier2d_classes"

[dependencies]
fixed.workspace = true
glam.workspace = true
rapier2d.workspace = true
rapier_core.workspace = true
rapier_dynamics2d.workspace = true
rapier_geometry2d.workspace = true
starknet = "2.19.4"

[dev-dependencies]
snforge_std.workspace = true
assert_macros.workspace = true
rapier_testing.workspace = true

[lib]

[[target.starknet-contract]]
sierra = true
casm = true

[tool]
fmt.workspace = true
scarb.workspace = true

# The workspace's snforge settings, plus a step cap for the whole-shot probes of
# `tests/split.cairo` (up to ~30M Cairo steps; snforge's default stops at 10M).
[tool.snforge]
tracked_resource = "sierra-gas"
max_n_steps = 400000000
