name: CI

on:
  push:
    branches: [main]
  pull_request:

# A pull request run cancels its superseded run; every push to main keeps its own run (a group of its own commit:
# GitHub keeps only one pending run per group, so a shared group would drop queued runs on main).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # CI tests run only when files related to them changed (lot CI1): the PR's changed paths, computed here, say which
  # jobs run (scripts/ci_changes.py holds the mapping and its self-test). A push to main runs everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      fmt: ${{ steps.paths.outputs.fmt }}
      lint: ${{ steps.paths.outputs.lint }}
      build: ${{ steps.paths.outputs.build }}
      test: ${{ steps.paths.outputs.test }}
      test_matrix: ${{ steps.paths.outputs.test_matrix }}
      gas: ${{ steps.paths.outputs.gas }}
      bytecode: ${{ steps.paths.outputs.bytecode }}
      sink: ${{ steps.paths.outputs.sink }}
      sink_matrix: ${{ steps.paths.outputs.sink_matrix }}
      consumer_cost: ${{ steps.paths.outputs.consumer_cost }}
      api_parity: ${{ steps.paths.outputs.api_parity }}
      golden: ${{ steps.paths.outputs.golden }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Changed paths and the jobs they concern
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            git -c core.quotepath=false diff --name-only --no-renames "$BASE...$HEAD" > changed.txt
            python3 scripts/ci_changes.py outputs < changed.txt > outputs.txt
          else
            : > changed.txt
            python3 scripts/ci_changes.py outputs --all < changed.txt > outputs.txt
          fi
          python3 scripts/ci_changes.py --self-test
          cat outputs.txt >> "$GITHUB_OUTPUT"
          {
            echo "### Changed paths ($EVENT)"; echo; echo '```'; cat changed.txt; echo '```'
            echo; echo "### Jobs that run"; echo; echo '```'; cat outputs.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  fmt:
    needs: changes
    if: needs.changes.outputs.fmt == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: software-mansion/setup-scarb@v1
        id: scarb
        continue-on-error: true
      - if: steps.scarb.outcome == 'failure'
        uses: software-mansion/setup-scarb@v1
      - run: scarb fmt --check --workspace

  lint:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: software-mansion/setup-scarb@v1
        id: scarb
        continue-on-error: true
      - if: steps.scarb.outcome == 'failure'
        uses: software-mansion/setup-scarb@v1
      - run: scarb lint --workspace --deny-warnings
      # Package granularity rule (docs/research/package-cost.md): the proxy gate, report only.
      - name: Library lines of the published crates (proxy of the package size gate, report only)
        run: python3 scripts/consumer_cost.py --lines-only --report-only --modules
      - name: Published crates do not depend on the internal ones
        run: |
          python3 - <<'PY'
          import glob, sys, tomllib
          internal = {"rapier_golden", "rapier_testing", "rapier_sink"}
          bad = []
          for path in sorted(glob.glob("crates/*/Scarb.toml")):
              with open(path, "rb") as f:
                  m = tomllib.load(f)
              if m["package"].get("publish", True) is False:
                  continue
              bad += [f"{path}: [dependencies] {d}" for d in internal & set(m.get("dependencies", {}))]
          if bad:
              sys.exit("internal crates under [dependencies] of a published crate (dev-dependencies only):\n"
                       + "\n".join(bad))
          PY

  build:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: software-mansion/setup-scarb@v1
        id: scarb
        continue-on-error: true
      - if: steps.scarb.outcome == 'failure'
        uses: software-mansion/setup-scarb@v1
      - run: scarb build --workspace

  test:
    # One job per crate group: the test crates are the compile-time bottleneck (docs/PLAN.md), so
    # they build in parallel; the `gas` job checks the snapshot on the merged logs.
    name: test (${{ matrix.group }})
    needs: changes
    if: needs.changes.outputs.test == 'true'
    runs-on: ubuntu-latest
    # Single-threaded compilation: on several threads the compiler places a `withdraw_gas` check in one
    # function or another, so the Sierra, CASM and gas compared with committed files vary (TC1).
    env:
      RAYON_NUM_THREADS: 1
    strategy:
      fail-fast: false
      # Only the groups whose files changed (the groups and their packages are listed in scripts/ci_changes.py).
      matrix: ${{ fromJSON(needs.changes.outputs.test_matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: software-mansion/setup-scarb@v1
        id: scarb
        continue-on-error: true
      - if: steps.scarb.outcome == 'failure'
        uses: software-mansion/setup-scarb@v1
      - uses: foundry-rs/setup-snfoundry@v6
        id: snfoundry
        continue-on-error: true
      - if: steps.snfoundry.outcome == 'failure'
        uses: foundry-rs/setup-snfoundry@v6
      - name: Run tests
        run: |
          set -o pipefail
          : > snforge-${{ matrix.group }}.log
          for p in ${{ matrix.packages }}; do
            snforge test -p "$p" --tracked-resource sierra-gas | tee -a snforge-${{ matrix.group }}.log
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snforge-${{ matrix.group }}
          path: snforge-${{ matrix.group }}.log

  gas:
    needs: [changes, test]
    if: needs.changes.outputs.gas == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: snforge-*
          merge-multiple: true
      # Only the test groups that ran have a log: the check compares them with the snapshots of their own crates
      # (a copy of scripts/gas.py over a gas/ tree holding those directories only), so a group that did not run is
      # never reported missing and a moved entry of a group that ran still fails. All four groups: the whole of gas/.
      - name: Check gas snapshot
        env:
          TEST_MATRIX: ${{ needs.changes.outputs.test_matrix }}
        run: |
          cat snforge-*.log > snforge.log
          tree="$RUNNER_TEMP/gas-tree"
          mkdir -p "$tree/scripts" "$tree/gas"
          cp scripts/gas.py "$tree/scripts/"
          for d in $(echo "$TEST_MATRIX" | python3 scripts/ci_changes.py gas-dirs); do
            if [ -d "gas/$d" ]; then cp -r "gas/$d" "$tree/gas/"; fi
          done
          ls "$tree/gas"
          python3 "$tree/scripts/gas.py" check --from-log snforge.log
      - name: Gas delta summary
        if: always()
        run: python3 "$RUNNER_TEMP/gas-tree/scripts/gas.py" diff --from-log snforge.log >> "$GITHUB_STEP_SUMMARY"

  bytecode:
    # Compiled class size of the crates/rapier_sink fixtures (Sierra / CASM felts, class bytes) against
    # gas/bytecode.size: any change fails (deterministic toolchain). Analysis: docs/research/class-size.md.
    needs: changes
    if: needs.changes.outputs.bytecode == 'true'
    runs-on: ubuntu-latest
    # Single-threaded compilation: on several threads the compiler places a `withdraw_gas` check in one
    # function or another, so the Sierra, CASM and gas compared with committed files vary (TC1).
    env:
      RAYON_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v7
      - uses: software-mansion/setup-scarb@v1
        id: scarb
        continue-on-error: true
      - if: steps.scarb.outcome == 'failure'
        uses: software-mansion/setup-scarb@v1
      - name: Check class sizes
        run: |
          set -o pipefail
          python3 scripts/bytecode_size.py check | tee -a "$GITHUB_STEP_SUMMARY"
      # gas/bytecode.size holds `sierra_bytes`, which depend on the absolute build path: the committed file is
      # this artifact, generated on the runner (programme rule, grimworld #283).
      - name: Snapshot class sizes
        if: always()
        run: python3 scripts/bytecode_size.py snapshot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bytecode-snapshot
          path: gas/bytecode.size

  sink:
    # The declared-class crates' own tests (CS3: the split layouts are bit-identical to the in-process step over the
    # pile10 reference shot; CS4–CS6: `rapier2d_classes`). One job per crate: a whole-shot run peaks near the runner's
    # 16 GB. Kept out of the `test` matrix: their logs are not gas-snapshotted.
    name: sink (${{ matrix.package }})
    needs: changes
    if: needs.changes.outputs.sink == 'true'
    runs-on: ubuntu-latest
    # Single-threaded compilation: on several threads the compiler places a `withdraw_gas` check in one
    # function or another, so the Sierra, CASM and gas compared with committed files vary (TC1).
    env:
      RAYON_NUM_THREADS: 1
    strategy:
      fail-fast: false
      # Only the crates whose files changed (scripts/ci_changes.py).
      matrix: ${{ fromJSON(needs.changes.outputs.sink_matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: software-mansion/setup-scarb@v1
        id: scarb
        continue-on-error: true
      - if: steps.scarb.outcome == 'failure'
        uses: software-mansion/setup-scarb@v1
      - uses: foundry-rs/setup-snfoundry@v6
        id: snfoundry
        continue-on-error: true
      - if: steps.snfoundry.outcome == 'failure'
        uses: foundry-rs/setup-snfoundry@v6
      # Two test threads: the whole-shot probes of `rapier2d_classes` peak near 4 GB each, and the default (one
      # thread per vCPU) got a runner shut down on #227.
      - run: snforge test -p ${{ matrix.package }} --max-threads 2
      # Class hashes depend on the absolute build path: the pins of crates/rapier2d_classes/tests/hashes.cairo come
      # from this artifact, with the runner's root path beside them (programme rule, grimworld #283).
      - name: Declared class hashes
        if: always() && matrix.package == 'rapier2d_classes'
        continue-on-error: true
        run: |
          {
            echo "root: $GITHUB_WORKSPACE"
            snforge test -p rapier2d_classes test_pinned_class_hashes --include-ignored --max-threads 2 || true
          } > class-hashes.txt 2>&1
          cat class-hashes.txt
      - uses: actions/upload-artifact@v4
        if: always() && matrix.package == 'rapier2d_classes'
        with:
          name: class-hashes
          path: class-hashes.txt

  # Package granularity rule (programme decision 2026-09-28, docs/research/package-cost.md): the
  # published crates and the product closures of consumer_cost.toml against the size gates, all
  # enforcing: gate 1 (library lines), gate 2 (a crate's MARGINAL cost over its direct dependencies,
  # computed by the shared script since nalgebra-cairo 7177cf3), gate 3 (closures; `rapier2d` is a
  # facade, judged on gate 3 only). Medians of 3 cold builds.
  consumer-cost:
    name: Consumer cost
    needs: changes
    if: needs.changes.outputs.consumer_cost == 'true'
    runs-on: ubuntu-latest
    # Single-threaded compilation: on several threads the compiler places a `withdraw_gas` check in one
    # function or another, so the Sierra, CASM and gas compared with committed files vary (TC1).
    env:
      RAYON_NUM_THREADS: 1
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: software-mansion/setup-scarb@v1
        id: scarb
        continue-on-error: true
      - if: steps.scarb.outcome == 'failure'
        uses: software-mansion/setup-scarb@v1
      - name: Measure the published crates and the closures (cold builds, interleaved rounds)
        run: |
          set +e
          python3 scripts/consumer_cost.py --modules --repeat 3 --interleave --json consumer_cost.json \
            | tee consumer_cost.md
          status=${PIPESTATUS[0]}
          set -e
          { echo "### Consumer cost (gates 1-3 enforced)"; echo; cat consumer_cost.md; } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      # The owner's table of every package against the thresholds (docs/PACKAGES.md is this file, committed from
      # a run of this job).
      - name: Package table (docs/PACKAGES.md format, artifact and job summary)
        if: always() && hashFiles('consumer_cost.json') != ''
        run: |
          python3 scripts/packages_table.py consumer_cost.json \
            --runner "ubuntu-latest, $(nproc) vCPU / $(free -g | awk '/Mem:/ {print $2}') GB" \
            --output PACKAGES.md
          cat PACKAGES.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consumer-cost
          path: |
            consumer_cost.json
            consumer_cost.md
            PACKAGES.md
          if-no-files-found: warn
          retention-days: 30

  api-parity:
    needs: changes
    if: needs.changes.outputs.api_parity == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: docs/API_PARITY.md is up to date
        run: python3 scripts/api_parity.py --check

  golden:
    needs: changes
    if: needs.changes.outputs.golden == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: software-mansion/setup-scarb@v1
        id: scarb
        continue-on-error: true
      - if: steps.scarb.outcome == 'failure'
        uses: software-mansion/setup-scarb@v1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/golden
      - name: Regenerate golden vectors
        working-directory: tools/golden
        run: cargo run --release --locked
      - name: Vectors and fixtures are up to date
        run: git diff --exit-code -- tools/golden/vectors crates/rapier_golden

  # The one result `gh pr checks` always has. It passes when every job passed, or was skipped because no file of it
  # changed; it fails when `changes` failed, a job failed or was cancelled, or a job that should have run was skipped
  # (a skip by error). The logic and its cases are in scripts/ci_changes.py.
  ci-ok:
    name: ci-ok
    needs: [changes, fmt, lint, build, test, gas, bytecode, sink, consumer-cost, api-parity, golden]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/ci_changes.py
          sparse-checkout-cone-mode: false
      - name: Verdict of the jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set +e
          python3 scripts/ci_changes.py verdict > verdict.txt
          status=$?
          cat verdict.txt
          { echo "### ci-ok"; echo; sed 's/^/- /' verdict.txt; } >> "$GITHUB_STEP_SUMMARY"
          exit $status
