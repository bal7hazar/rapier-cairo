name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: software-mansion/setup-scarb@v1
      - run: scarb fmt --check --workspace

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: software-mansion/setup-scarb@v1
      - run: scarb lint --workspace --deny-warnings
      # Package granularity rule (docs/research/package-cost.md): the proxy gate, report only.
      - name: Library lines of the published crates (proxy of the package size gate, report only)
        run: python3 scripts/consumer_cost.py --lines-only --report-only --modules
      - name: Published crates do not depend on the internal ones
        run: |
          python3 - <<'PY'
          import glob, sys, tomllib
          internal = {"rapier_golden", "rapier_testing", "rapier_sink"}
          bad = []
          for path in sorted(glob.glob("crates/*/Scarb.toml")):
              with open(path, "rb") as f:
                  m = tomllib.load(f)
              if m["package"].get("publish", True) is False:
                  continue
              bad += [f"{path}: [dependencies] {d}" for d in internal & set(m.get("dependencies", {}))]
          if bad:
              sys.exit("internal crates under [dependencies] of a published crate (dev-dependencies only):\n"
                       + "\n".join(bad))
          PY

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: software-mansion/setup-scarb@v1
      - run: scarb build --workspace

  test:
    # One job per crate group: the test crates are the compile-time bottleneck (docs/PLAN.md), so
    # they build in parallel; the `gas` job checks the snapshot on the merged logs.
    name: test (${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: core-math-golden
            packages: rapier_testing rapier_math rapier_core rapier_golden
          - group: geometry2d
            packages: rapier_geometry2d
          - group: dynamics2d
            packages: rapier_dynamics2d
          - group: rapier2d
            packages: rapier2d
    steps:
      - uses: actions/checkout@v7
      - uses: software-mansion/setup-scarb@v1
      - uses: foundry-rs/setup-snfoundry@v6
      - name: Run tests
        run: |
          set -o pipefail
          : > snforge-${{ matrix.group }}.log
          for p in ${{ matrix.packages }}; do
            snforge test -p "$p" --tracked-resource sierra-gas | tee -a snforge-${{ matrix.group }}.log
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snforge-${{ matrix.group }}
          path: snforge-${{ matrix.group }}.log

  gas:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: snforge-*
          merge-multiple: true
      - name: Check gas snapshot
        run: |
          cat snforge-*.log > snforge.log
          python3 scripts/gas.py check --from-log snforge.log
      - name: Gas delta summary
        if: always()
        run: python3 scripts/gas.py diff --from-log snforge.log >> "$GITHUB_STEP_SUMMARY"

  bytecode:
    # Compiled class size of the crates/rapier_sink fixtures (Sierra / CASM felts, class bytes) against
    # gas/bytecode.size: any change fails (deterministic toolchain). Analysis: docs/research/class-size.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: software-mansion/setup-scarb@v1
      - name: Check class sizes
        run: |
          set -o pipefail
          python3 scripts/bytecode_size.py check | tee -a "$GITHUB_STEP_SUMMARY"

  sink:
    # The declared-class crates' own tests (CS3: the split layouts are bit-identical to the in-process step over the
    # pile10 reference shot; CS4–CS6: `rapier2d_classes`). One job per crate: a whole-shot run peaks near the runner's
    # 16 GB. Kept out of the `test` matrix: their logs are not gas-snapshotted.
    name: sink (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [rapier_sink, rapier2d_classes]
    steps:
      - uses: actions/checkout@v7
      - uses: software-mansion/setup-scarb@v1
      - uses: foundry-rs/setup-snfoundry@v6
      - run: snforge test -p ${{ matrix.package }}

  # Package granularity rule (programme decision 2026-09-28, docs/research/package-cost.md): the
  # published crates and the product closures of consumer_cost.toml against the size gates (lines,
  # cold-build time and memory an empty consumer adds over the no-dependency build). Report only: the
  # script reports the cost over the baseline while gate 2 is the marginal cost (crate minus its direct
  # dependencies; `deps_of_rapier_geometry2d` gives geometry2d's, the crate rows give the others'). The
  # orchestrator makes it enforcing with alpha.7.
  consumer-cost:
    name: Consumer cost
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: software-mansion/setup-scarb@v1
      - name: Measure the published crates and the closures (cold builds, one after the other)
        run: |
          python3 scripts/consumer_cost.py --report-only --modules --repeat 3 --json consumer_cost.json \
            --closure deps_of_rapier_geometry2d=rapier_core,rapier_math | tee consumer_cost.md
          { echo "### Consumer cost (report only)"; echo; cat consumer_cost.md; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consumer-cost
          path: |
            consumer_cost.json
            consumer_cost.md
          if-no-files-found: warn
          retention-days: 30

  api-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: docs/API_PARITY.md is up to date
        run: python3 scripts/api_parity.py --check

  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: software-mansion/setup-scarb@v1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/golden
      - name: Regenerate golden vectors
        working-directory: tools/golden
        run: cargo run --release --locked
      - name: Vectors and fixtures are up to date
        run: git diff --exit-code -- tools/golden/vectors crates/rapier_golden
