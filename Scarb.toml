[workspace]
members = ["crates/*"]

[workspace.package]
version = "0.1.0-alpha.3"
edition = "2024_07"
cairo-version = "2.19.4"
license = "MIT"
repository = "https://github.com/bal7hazar/rapier-cairo"

[workspace.dependencies]
# Shared Q32.32 scalar (`fixed`, repo bal7hazar/fixed-cairo) and vector types (`glam`, repo
# bal7hazar/glam-cairo), released on scarbs.xyz (docs/PLAN.md D12). Pre-1.0: a MINOR bump may change
# numeric results (glam-cairo DESIGN §6), so it is its own PR.
fixed = "0.3.0"
glam = "0.3.0"
# Workspace crates: a path for development, the version for `scarb package` (which drops the path).
# `scripts/release.sh <version>` bumps `workspace.package.version` and these requirements together.
rapier_math = { path = "crates/rapier_math", version = "0.1.0-alpha.3" }
rapier_core = { path = "crates/rapier_core", version = "0.1.0-alpha.3" }
rapier_geometry2d = { path = "crates/rapier_geometry2d", version = "0.1.0-alpha.3" }
rapier_dynamics2d = { path = "crates/rapier_dynamics2d", version = "0.1.0-alpha.3" }
rapier_testing = { path = "crates/rapier_testing", version = "0.1.0-alpha.3" }
rapier_golden = { path = "crates/rapier_golden", version = "0.1.0-alpha.3" }
snforge_std = "0.61.0"
assert_macros = "2.19.4"

[workspace.tool.scarb]
allow-prebuilt-plugins = ["snforge_std"]

[workspace.tool.fmt]
sort-module-level-items = true
max-line-length = 100

[workspace.tool.snforge]
tracked_resource = "sierra-gas"

[scripts]
test = "snforge test --workspace"
gas = "python3 scripts/gas.py snapshot"
gas-check = "python3 scripts/gas.py check"
