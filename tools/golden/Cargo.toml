[package]
name = "rapier-golden"
version = "0.1.0"
edition = "2021"
publish = false
description = "Golden-vector harness: runs upstream Rapier/Parry (f64, 2D) and emits reference vectors for rapier-cairo."
license = "MIT"

[[bin]]
name = "golden"
path = "src/main.rs"

[dependencies]
# Exact pins: the vectors are only meaningful for a precise upstream version.
# `block-solver` is a default feature of rapier: it is dropped on purpose (see README).
rapier2d-f64 = { version = "=0.35.3", default-features = false, features = ["dim2", "f64", "std", "enhanced-determinism"] }
# The published rapier2d-f64 0.35.3 asks for parry2d-f64 ^0.30.2; the vendored copy below asks for
# 0.31.1 (see vendor/README.md), so pinning it here keeps a single parry in the lock.
parry2d-f64 = { version = "=0.31.1", features = ["enhanced-determinism"] }
# f32 build, used ONLY to read cuboid feature ids: the published `Cuboid::vertex_feature_id` reads
# bit 31 of the float, the sign bit in f32 but a mantissa bit in f64 (see README, "Feature ids").
# The vendored f64 copy below is fixed; the f32 ids stay as an independent cross-check.
parry2d = { version = "=0.31.1", features = ["enhanced-determinism"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }

[profile.release]
codegen-units = 1

# Vendored parry2d-f64 0.31.1 with the f64 cuboid feature-id fix, and rapier2d-f64 0.35.3 with its
# parry requirement raised to 0.31.1 (see vendor/README.md). Rapier's own dependency on parry2d-f64
# resolves to the patched copy too, so the scenes use correct ids.
[patch.crates-io]
parry2d-f64 = { path = "vendor/parry2d-f64" }
rapier2d-f64 = { path = "vendor/rapier2d-f64" }
