[package]
name = "ball_drop"
description = "rapier-cairo example: a physics scene stepped in an executable, for scarb execute and scarb prove."
version = "0.1.0"
edition = "2024_07"
cairo-version = "2.19.4"
license = "MIT"

[dependencies]
# Same versions as the root workspace (two sources of `fixed` would mean two `Fixed` types).
fixed = "0.3.0"
glam = "0.3.0"
# By path, so that the example (run by the `execute` CI job) tracks `main`; games pin the registry version,
# e.g. `rapier2d = "0.1.0-alpha.2"`.
rapier2d = { path = "../../crates/rapier2d" }
cairo_execute = "2.19.4"

[dev-dependencies]
assert_macros = "2.19.4"
cairo_test = "2.19.4"

[executable]

[cairo]
enable-gas = false

[tool.fmt]
sort-module-level-items = true
max-line-length = 100
